<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="PermissionFlow: runtime permissions for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14123a"/>
      <stop offset="1" stop-color="#1f3b5c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phone">
      <rect x="820" y="70" width="320" height="440" rx="36"/>
    </clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="210" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-2">PermissionFlow</text>
    <text x="82" y="264" fill="#c7d2fe" font-size="27" font-weight="500">Runtime permissions for Jetpack Compose, done right:</text>
    <text x="82" y="300" fill="#c7d2fe" font-size="27" font-weight="500">observable state, permanent denial and Settings</text>
    <text x="82" y="362" fill="#a5b4fc" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">val camera = rememberPermissionState(CAMERA)</text>

    <g font-size="18" font-weight="600" fill="#e0e7ff">
      <rect x="82" y="396" width="114" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="139" y="421" text-anchor="middle">Granted</text>
      <rect x="208" y="396" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="262" y="421" text-anchor="middle">Denied</text>
      <rect x="328" y="396" width="226" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="441" y="421" text-anchor="middle">Permanently denied</text>
      <rect x="566" y="396" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="646" y="421" text-anchor="middle">Not requested</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="820" y="70" width="320" height="440" rx="36" fill="#f8fafc"/>
      <g clip-path="url(#phone)">
        <text x="850" y="130" fill="#0f172a" font-size="24" font-weight="700">PermissionFlow</text>
        <rect x="850" y="152" width="260" height="92" rx="16" fill="#1b1f24"/>
        <path d="M912 172h-14v14M1048 172h14v14M912 224h-14v-14M1048 224h14v-14" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round"/>
        <line x1="910" y1="198" x2="1050" y2="198" stroke="#ef5350" stroke-width="2"/>
        <rect x="820" y="270" width="320" height="240" fill="#0f172a" fill-opacity="0.35"/>
        <rect x="820" y="300" width="320" height="220" rx="28" fill="#ffffff"/>
        <rect x="960" y="312" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
        <circle cx="980" cy="358" r="26" fill="#e0e7ff"/>
        <path d="M980 342a11 11 0 0 0-11 11c0 8 11 20 11 20s11-12 11-20a11 11 0 0 0-11-11zm0 7a4 4 0 1 1 0 8a4 4 0 1 1 0-8z" fill="#3730a3" fill-rule="evenodd"/>
        <text x="980" y="410" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Show stores near you</text>
        <text x="980" y="436" fill="#475569" font-size="13" text-anchor="middle">Used only while the app is open</text>
        <text x="962" y="484" fill="#4f46e5" font-size="15" font-weight="600" text-anchor="middle">Not now</text>
        <rect x="1010" y="462" width="96" height="36" rx="18" fill="#4f46e5"/>
        <text x="1058" y="485" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Allow</text>
      </g>
    </g>
  </g>
</svg>
